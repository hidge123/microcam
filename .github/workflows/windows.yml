name: Windows

on:
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Smoke-test Win32 collector
        shell: powershell
        run: .\src\platform\win32-monitor.ps1 -Once | ConvertFrom-Json | Out-Null
      - name: Build unsigned validation packages
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: microcam-windows-unsigned
          path: windows/dist/*.exe
          if-no-files-found: error
          retention-days: 14
